<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <title>TF Model Code Decoder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Kanit", sans-serif;
            background: #f2f2f2;
            padding: 2rem;
            max-width: 800px;
            margin: auto;
        }
        h1 {
            font-size: 26px;
            text-align: center;
            color: #1976d2;
            margin-bottom: 24px;
        }
        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .search-box input {
            font-family: "Kanit", sans-serif;
            font-size: 18px;
            padding: 12px 20px;
            width: 70%;
            border: 1px solid #ccc;
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
            outline: none;
            text-transform: uppercase;
        }
        .search-box button {
            font-family: "Kanit", sans-serif;
            font-size: 18px;
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: #db2e33;
            color: white;
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
            transition: background 0.2s ease;
        }
        .search-box button:hover {
            background: #b72125;
        }
        .result-container {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
        }
        .result-header {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #efefef;
            padding-bottom: 10px;
        }
        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .result-item {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #1976d2;
        }
        .result-item span.label {
            font-size: 14px;
            color: #888;
            display: block;
            margin-bottom: 4px;
        }
        .result-item span.value {
            font-size: 16px;
            font-weight: bold;
            color: #222;
        }
        .error-msg {
            color: red;
            text-align: center;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🚙 ถอดรหัส TF Model Code</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="เช่น TFS46JCNHMT (11 หลัก)" maxlength="11" />
        <button id="searchBtn">ถอดรหัส</button>
    </div>
    
    <div id="errorMsg" class="error-msg"></div>

    <div id="resultContainer" class="result-container">
        <div class="result-header" id="displayCode">TFS46JCNHMT</div>
        <div class="result-grid" id="resultGrid">
            <!-- ผลลัพธ์จะถูกแทรกที่นี่ผ่าน JS -->
        </div>
    </div>

    <script src="tf-model.js"></script>
</body>
</html>
