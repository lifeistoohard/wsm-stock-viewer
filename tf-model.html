<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <title>TF Model Code Decoder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Kanit", sans-serif;
            background: #f2f2f2;
            padding: 2rem;
            max-width: 800px;
            margin: auto;
        }
        h1 {
            font-size: 26px;
            text-align: center;
            color: #1976d2;
            margin-bottom: 24px;
        }
        
        /* สไตล์ของช่องกรอกรหัสแบบแยกช่อง */
        .search-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .code-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .code-box {
            width: 45px;
            height: 55px;
            font-size: 24px;
            font-family: "Kanit", sans-serif;
            font-weight: bold;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-transform: uppercase;
            outline: none;
            color: #db2e33;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .code-box:focus {
            border-color: #1976d2;
            box-shadow: 0 0 8px rgba(25, 118, 210, 0.3);
        }
        /* ช่องเครื่องยนต์กว้างกว่าเพื่อนเพราะมี 2 ตัว */
        .engine-box {
            width: 65px; 
        }

        .search-container button {
            font-family: "Kanit", sans-serif;
            font-size: 18px;
            padding: 12px 32px;
            cursor: pointer;
            border: none;
            background: #db2e33;
            color: white;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s ease, transform 0.1s;
        }
        .search-container button:hover {
            background: #b72125;
            transform: translateY(-2px);
        }
        
        /* สไตล์ผลลัพธ์ */
        .result-container {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
        }
        .result-header {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #efefef;
            padding-bottom: 10px;
            letter-spacing: 2px;
        }
        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .result-item {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #1976d2;
        }
        .result-item span.label {
            font-size: 14px;
            color: #888;
            display: block;
            margin-bottom: 4px;
        }
        .result-item span.value {
            font-size: 16px;
            font-weight: bold;
            color: #222;
        }
        .error-msg {
            color: red;
            text-align: center;
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>🚙 ถอดรหัส TF Model Code</h1>

    <!-- เปลี่ยนเป็นช่องกรอก 10 ช่องตามหลักของรหัส -->
    <div class="search-container">
        <div class="code-inputs" id="codeInputContainer">
            <input type="text" maxlength="1" class="code-box" placeholder="T">
            <input type="text" maxlength="1" class="code-box" placeholder="F">
            <input type="text" maxlength="1" class="code-box" placeholder="S">
            <input type="text" maxlength="2" class="code-box engine-box" placeholder="46">
            <input type="text" maxlength="1" class="code-box" placeholder="J">
            <input type="text" maxlength="1" class="code-box" placeholder="C">
            <input type="text" maxlength="1" class="code-box" placeholder="N">
            <input type="text" maxlength="1" class="code-box" placeholder="H">
            <input type="text" maxlength="1" class="code-box" placeholder="M">
            <input type="text" maxlength="1" class="code-box" placeholder="T">
        </div>
        <button id="searchBtn">ถอดรหัส</button>
    </div>
    
    <div id="errorMsg" class="error-msg"></div>

    <div id="resultContainer" class="result-container">
        <div class="result-header" id="displayCode">TFS46JCNHMT</div>
        <div class="result-grid" id="resultGrid">
            <!-- ผลลัพธ์จะถูกแทรกที่นี่ผ่าน JS -->
        </div>
    </div>

    <script src="tf-model.js"></script>
</body>
</html>
