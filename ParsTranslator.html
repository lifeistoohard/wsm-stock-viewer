<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <title>Part Name Translator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Kanit", sans-serif;
            background: #f2f2f2;
            padding: 2rem;
            max-width: 800px;
            margin: auto;
        }
        header {
            margin-bottom: 1.5rem;
            text-align: center;
        }
        header img {
            width: 100%;
            max-width: 800px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            /* No text-align: center; here */
        }
        /* กรอบค้นหาแบบ Google */
        .search-box {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
        }
        .search-box input {
            font-family: "Kanit", sans-serif; /* Add this line */
            font-size: 16px;
            padding: 12px 20px;
            width: 70%;
            border: 1px solid #ccc;
            border-top-left-radius: 25px;
            border-bottom-left-radius: 25px;
            outline: none;
        }
        .search-box button {
            font-size: 16px;
            padding: 12px 20px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-top-right-radius: 25px;
            border-bottom-right-radius: 25px;
            background: #f8f9fa;
            color: #1976d2;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        .search-box button:hover {
            background: #e8e8e8;
        }
        .results-container {
            margin-top: 24px;
        }
        /* กรอบแสดงผลลัพธ์ */
        .result-group {
            background: #fff;
            padding: 16px 24px;
            border-radius: 25px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin-bottom: 16px;
            border-left: 6px solid #db2e33;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-content {
            flex-grow: 1;
        }
        .result-group h2 {
            font-size: 20px;
            margin: 0 0 8px;
            color: #1976d2;
        }
        .result-group p {
            font-size: 16px;
            margin: 0;
            color: #555;
        }
        /* ปุ่ม Copy */
        .copy-btn {
            font-family: "Kanit", sans-serif; /* Add this line for button text */
            font-size: 16px;
            padding: 12px 20px;
            margin-left: 20px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            color: #1976d2;
            border-radius: 25px;
            transition: background 0.2s ease, color 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .copy-btn:hover {
            background: #e6e6e6;
            color: #125ea4;
        }
        .footer {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-top: 40px;
        }
        .footer a {
            color: #1976d2;
            text-decoration: none;
            margin: 0 8px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        #notification-toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            transform: translateX(-50%);
            bottom: 30px;
            font-size: 17px;
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s;
        }
        #notification-toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body>
    <header>
        <img src="trans_head.png" alt="ค้นหาชื่ออะไหล่" />
    </header>

    <h1>📋 ค้นหาคำแปลอะไหล่ </h1>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="🔍 พิมพ์ชื่ออะไหล่ภาษาอังกฤษหรือไทย เช่น oil filter, เบรก..."
            list="suggestions"
        />
        <datalist id="suggestions"></datalist>
        <button id="searchBtn">ค้นหา</button>
    </div>

    <div id="results" class="results-container"></div>

    <div class="footer">
  Created by <strong>NA</strong> | <a href="https://lifeistoohard.github.io/wsm-stock-viewer/service/service.html" target="_blank">
    ไปยัง Service Bulletins
  </a>
  | <a href="https://lifeistoohard.github.io/wsm-stock-viewer/ParsTranslator.html">Part name Translator</a>
  | <a href="https://lifeistoohard.github.io/pdf-linker-app/">WSM Link Generator</a>
</div>
<div style="position: fixed; bottom: 1.5rem; left: 1.5rem; font-size: 12px; color: #888;">
  V2.3 by NA
</div>

    <script src="PartsTranslator.js"></script>
    <div id="notification-toast">✅ คัดลอกแล้ว!</div>
</body>
</html>
